# SANE backend configuration for Mustek S400W / iScanFly
#
# Each line can specify a device hostname/IP and optional port.
# If no port is specified, port 23 is used.
#
# Global options:
# autocrop yes|no  (default: yes)
# deskew yes|no    (default: yes)
# log_level off|error|warn|info|debug|trace  (default: warn)
# max_bad_lines <N> (default: 2; 1-2 bad scanlines log a warning, >N fails scan)
#
# Example:
# autocrop yes
# deskew yes
# log_level warn
# max_bad_lines 2
# 192.168.18.33
# 192.168.1.100:23
# iscanfly.local

autocrop yes
deskew yes
log_level warn
max_bad_lines 2
192.168.18.33


